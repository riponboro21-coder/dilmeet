<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DilMeet</title>

<style>

body{
background:black;
color:white;
font-family:Arial;
padding:20px;
}

.card{
background:#111;
border-radius:20px;
overflow:hidden;
max-width:350px;
margin:auto;
}

img{
width:100%;
height:400px;
object-fit:cover;
}

.info{
padding:15px;
}

button{
padding:12px;
border:none;
border-radius:12px;
margin:5px;
font-size:20px;
}

.like{
background:pink;
}

.super{
background:deepskyblue;
}

</style>
</head>

<body>

<div class="card">

<img id="profileImg" src="">

<div class="info">

<h1 id="profileName">Loading...</h1>

<h3 id="profileCity">Loading...</h3>

<p id="profileBio">Loading...</p>

<button id="dislike">❌</button>

<button id="fav">⭐</button>

<button class="like">❤️</button>

<button class="super">⚡</button>

</div>
</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
getFirestore,
collection,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {

apiKey: "AIzaSyC0eHHNiFmn5tih1Nou3wLEDOI7OdZ6Rc4",

authDomain: "dilmeet-f9aff.firebaseapp.com",

projectId: "dilmeet-f9aff",

storageBucket: "dilmeet-f9aff.firebasestorage.app",

messagingSenderId: "83003012729",

appId: "1:83003012729:web:c4630efdc600d73e43c6a8"

};

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);

let profiles = [];

let current = 0;

async function loadProfiles(){

const querySnapshot =
await getDocs(collection(db,"profiles"));

profiles = [];

querySnapshot.forEach((doc)=>{
profiles.push(doc.data());
});

if(profiles.length > 0){
showProfile();
}

}

function showProfile(){

document.getElementById("profileName").innerText =
profiles[current].name;

document.getElementById("profileCity").innerText =
profiles[current].city;

document.getElementById("profileBio").innerText =
profiles[current].bio;

document.getElementById("profileImg").src =
profiles[current].img;

}

function nextProfile(){

current =
(current + 1) % profiles.length;

showProfile();

}

document.getElementById("dislike").onclick =
nextProfile;

document.querySelector(".like").onclick = ()=>{

alert("🎉 Match Found!");

nextProfile();

};

document.querySelector(".super").onclick = ()=>{

alert("⚡ Super Like!");

nextProfile();

};

document.getElementById("fav").onclick = ()=>{

alert("⭐ Saved");

};

loadProfiles();

</script>

</body>
</html>
