<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DilMeet</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0d0d0d;
color:white;
padding:15px;
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

.logo{
font-size:32px;
font-weight:bold;
background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.icons button{
background:#1a1a1a;
border:none;
color:white;
padding:12px;
border-radius:12px;
margin-left:8px;
font-size:18px;
}

.tabs,.chips{
display:flex;
gap:10px;
overflow:auto;
margin-bottom:15px;
}

.tabs button,.chips button{
border:none;
padding:10px 16px;
border-radius:20px;
background:#1a1a1a;
color:#bbb;
}

.active{
background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5)!important;
color:white!important;
}

.card{
background:#111;
border-radius:24px;
overflow:hidden;
box-shadow:0 10px 30px rgba(0,0,0,.5);
}

.card img{
width:100%;
height:420px;
object-fit:cover;
}

.info{
padding:18px;
}

.match{
display:inline-block;
background:#000;
padding:8px 14px;
border-radius:20px;
color:#ffd54f;
margin-bottom:10px;
}

.voice{
display:inline-block;
padding:8px 14px;
border:1px solid #444;
border-radius:20px;
margin-left:10px;
}

.name{
font-size:30px;
font-weight:bold;
margin-top:10px;
}

.city{
margin-top:8px;
color:#ccc;
}

.bio{
margin-top:10px;
color:#ddd;
line-height:1.5;
}

.tags{
display:flex;
gap:8px;
flex-wrap:wrap;
margin-top:15px;
}

.tags span{
background:#222;
padding:8px 12px;
border-radius:14px;
}

.actions{
display:flex;
justify-content:space-around;
margin-top:20px;
padding-bottom:20px;
}

.actions button{
width:60px;
height:60px;
border:none;
border-radius:50%;
font-size:22px;
background:#1a1a1a;
color:white;
}

.like{
background:#ff2d75!important;
}

.super{
background:#2b86c5!important;
}
</style>
</head>

<body>

<div class="top">
<div class="logo">💘 DilMeet</div>

<div class="icons">
<button id="themeBtn">☀️</button>
<button id="profileBtn">👤</button>
</div>
</div>

<div class="tabs">
<button class="active">🔍 Discover</button>
<button>💕 Matches</button>
<button>📍 Nearby</button>
</div>

<div class="chips">
<button class="active">✨ All</button>
<button>🎉 Fun</button>
<button>💼 Serious</button>
<button>🤝 Friendship</button>
<button>😊 Casual</button>
</div>

<div class="card">

<img id="profileImg"
src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=800&auto=format&fit=crop">

<div class="info">

<div>
<span class="match">🤖 91% Match</span>
<span class="voice">🎙 Voice Intro</span>
</div>

<div class="name" id="profileName">Ananya 22</div>

<div class="city" id="profileCity">Kolkata 📍</div>

<div class="bio" id="profileBio">
Artist 🎨 | Coffee lover ☕ | Traveller ✈️
</div>

<div class="tags">
<span>#Travel</span>
<span>#Coffee</span>
<span>#Music</span>
<span>#Fun</span>
</div>

<div class="actions">
<button id="dislike">❌</button>
<button id="fav">⭐</button>
<button class="like">❤️</button>
<button class="super">⚡</button>
</div>

</div>
</div>

<script>

const profiles = [

{
name:"Ananya 22",
city:"Kolkata 📍",
bio:"Artist 🎨 | Coffee lover ☕ | Traveller ✈️",
img:"https://images.unsplash.com/photo-1494790108377-be9c29b29330?q=80&w=800&auto=format&fit=crop"
},

{
name:"Riya 23",
city:"Mumbai 📍",
bio:"Movies 🎬 | Dance 💃 | Foodie 🍕",
img:"https://images.unsplash.com/photo-1488426862026-3ee34a7d66df?q=80&w=800&auto=format&fit=crop"
},

{
name:"Sneha 24",
city:"Delhi 📍",
bio:"Fitness 💪 | Books 📚 | Music 🎵",
img:"https://images.unsplash.com/photo-1517841905240-472988babdf9?q=80&w=800&auto=format&fit=crop"
}

];

let current = 0;

function showProfile(){

document.getElementById("profileName").innerText =
profiles[current].name;

document.getElementById("profileCity").innerText =
profiles[current].city;

document.getElementById("profileBio").innerText =
profiles[current].bio;

document.getElementById("profileImg").src =
profiles[current].img;
}

function nextProfile(){

current = (current + 1) % profiles.length;

showProfile();
}

document.getElementById("dislike").onclick = nextProfile;

document.querySelector(".like").onclick = () => {
alert("🎉 Match Found!");
nextProfile();
};

document.querySelector(".super").onclick = () => {
alert("⚡ Super Like Sent!");
nextProfile();
};

document.getElementById("fav").onclick = () => {
alert("⭐ Saved to Favorites");
};

document.getElementById("themeBtn").onclick = () => {
alert("🌙 Theme option coming soon");
};

document.getElementById("profileBtn").onclick = () => {
alert("👤 Profile section coming soon");
};

document.querySelectorAll(".tabs button").forEach(btn=>{
btn.onclick = function(){

document.querySelectorAll(".tabs button")
.forEach(b=>b.classList.remove("active"));

this.classList.add("active");
};
});

document.querySelectorAll(".chips button").forEach(btn=>{
btn.onclick = function(){

document.querySelectorAll(".chips button")
.forEach(b=>b.classList.remove("active"));

this.classList.add("active");
};
});

// Swipe
let startX = 0;

const card = document.querySelector(".card");

card.addEventListener("touchstart",e=>{
startX = e.touches[0].clientX;
});

card.addEventListener("touchend",e=>{

let diff =
startX - e.changedTouches[0].clientX;

if(Math.abs(diff) > 50){
nextProfile();
}

});

</script>

</body>
</html>
