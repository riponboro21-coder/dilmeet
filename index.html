<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DilMeet Premium</title>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#090909;color:white;padding:15px;}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.logo{font-size:34px;font-weight:bold;background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.icons button{background:#111;border:none;color:white;padding:12px;margin-left:8px;border-radius:12px;font-size:18px;}
.tabs,.chips{display:flex;gap:10px;overflow:auto;margin-bottom:15px;}
.tabs button,.chips button{border:none;padding:12px 18px;border-radius:20px;background:#141414;color:#bbb;}
.active{background:linear-gradient(90deg,#ff3cac,#784ba0,#2b86c5)!important;color:white!important;}
.card{background:#111;border-radius:25px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.5);}
.card img{width:100%;height:430px;object-fit:cover;}
.info{padding:18px;}
.match{background:#000;padding:8px 14px;border-radius:20px;color:#ffd54f;margin-bottom:10px;display:inline-block;}
.voice{padding:8px 14px;border:1px solid #444;border-radius:20px;margin-left:10px;}
.name{font-size:32px;font-weight:bold;margin-top:10px;}
.city{color:#ccc;margin-top:8px;}
.bio{margin-top:10px;color:#ddd;}
.tags{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px;}
.tags span{background:#222;padding:8px 12px;border-radius:14px;}
.actions{display:flex;justify-content:space-around;margin-top:20px;padding-bottom:20px;}
.actions button{width:60px;height:60px;border:none;border-radius:50%;font-size:22px;background:#1a1a1a;color:white;}
.like{background:#ff2d75!important;}
.super{background:#2b86c5!important;}
</style>
</head>

<body>

<div class="top">
<div class="logo">💘 Dil Meet</div>
<div class="icons">
<button>☀️</button>
<button>👤</button>
</div>
</div>

<div class="tabs">
<button class="active">🔍 Discover</button>
<button>💕 Matches</button>
<button>📍 Nearby</button>
</div>

<div class="chips">
<button class="active">✨ All</button>
<button>🎉 Fun</button>
<button>💼 Serious</button>
<button>🤝 Friendship</button>
<button>😊 Casual</button>
</div>

<div class="card">
<img id="profileImg" src="">

<div class="info">
<div>
<span class="match">🤖 91% Match</span>
<span class="voice">🎙 Voice Intro</span>
</div>

<div class="name" id="profileName">Loading...</div>
<div class="city" id="profileCity">📍 Loading...</div>
<div class="bio" id="profileBio">Loading...</div>

<div class="tags">
<span>#Tech</span>
<span>#Coffee</span>
<span>#Travel</span>
<span>#Movies</span>
</div>

<div class="actions">
<button id="dislike">❌</button>
<button id="fav">⭐</button>
<button class="like">❤️</button>
<button class="super">⚡</button>
</div>

</div>
</div>
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";
import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0eHHNiFmn5tih1Nou3wLEDOI7OdZ6Rc4",
  authDomain: "dilmeet-f9aff.firebaseapp.com",
  projectId: "dilmeet-f9aff",
  storageBucket: "dilmeet-f9aff.appspot.com",
  messagingSenderId: "83003012729",
  appId: "1:83003012729:web:c4630efdc600d73e43c6a8"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let profiles = [];
let current = 0;

window.onload = async () => {
  await loadProfiles();
};

async function loadProfiles(){
  const querySnapshot = await getDocs(collection(db,"profiles"));
  profiles = [];
  querySnapshot.forEach(doc => profiles.push(doc.data()));

  if(profiles.length > 0){
    showProfile();
  }
}

function showProfile(){
  document.getElementById("profileName").innerText = profiles[current]?.name || "No Name";
  document.getElementById("profileCity").innerText = profiles[current]?.city || "No City";
  document.getElementById("profileBio").innerText = profiles[current]?.bio || "No Bio";
  document.getElementById("profileImg").src = profiles[current]?.img || "";
}

function nextProfile(){
  if(profiles.length === 0) return;
  current = (current + 1) % profiles.length;
  showProfile();
}

// buttons
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("dislike").onclick = nextProfile;

  document.querySelector(".like").onclick = ()=>{
    alert("🎉 Match!");
    nextProfile();
  };

  document.querySelector(".super").onclick = ()=>{
    alert("⚡ Super Like!");
    nextProfile();
  };

  document.getElementById("fav").onclick = ()=>{
    alert("⭐ Saved");
  };

  // swipe
  let startX = 0;
  const card = document.querySelector(".card");

  card.addEventListener("touchstart", e=>{
    startX = e.touches[0].clientX;
  });

  card.addEventListener("touchend", e=>{
    let diff = startX - e.changedTouches[0].clientX;
    if(Math.abs(diff) > 50){
      nextProfile();
    }
  });
});

</script>

</body>
</html>
